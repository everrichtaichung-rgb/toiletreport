<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>廁所通報系統</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body{
      font-family:sans-serif;
      padding:25px;
      text-align:center;
      background:#f5f5f5;
    }

    .title{
      font-size:26px;
      margin:20px 0;
      font-weight:bold;
      line-height:1.6;
    }

    button{
      width:90%;
      padding:16px;
      margin:8px;
      font-size:20px;
      border:none;
      border-radius:12px;
      background:#06C755;
      color:white;
    }

    .back{
      background:#888;
    }

    textarea{
      width:90%;
      height:100px;
      margin-top:15px;
      padding:12px;
      font-size:18px;
      border-radius:10px;
      border:1px solid #ccc;
    }
  </style>
</head>

<body>

<div class="title" id="location">讀取中...</div>

<div id="main"></div>

<script>

const LIFF_ID = "2009817649-AiEjedLg";

let loc = "";
let gender = ""; // M or F

function renderMale(){

  document.getElementById("main").innerHTML = `
    <button onclick="sendMsg('衛生紙不足')">衛生紙不足</button>

    <button onclick="sendMsg('酒精不足')">酒精不足</button>

    <button onclick="sendMsg('洗手乳不足')">
      洗手乳不足
    </button>

    <button onclick="sendMsg('需要清潔')">
      需要清潔
    </button>

    <button onclick="sendMsg('設備故障')">
      設備故障
    </button>

    <textarea id="other"
      placeholder="其他問題（可不填）"></textarea>

    <button class="back" onclick="sendOther()">
      送出其他問題
    </button>
  `;
}

function renderFemale(){

  document.getElementById("main").innerHTML = `
    <button onclick="sendMsg('衛生紙不足')">
      衛生紙不足
    </button>

    <button onclick="sendMsg('酒精不足')">
      酒精不足
    </button>

    <button onclick="sendMsg('洗手乳不足')">
      洗手乳不足
    </button>

    <button onclick="sendMsg('女性生理用品需求')">
      女性生理用品需求
    </button>

    <button onclick="sendMsg('需要清潔')">
      需要清潔
    </button>

    <button onclick="sendMsg('設備故障')">
      設備故障
    </button>

    <textarea id="other"
      placeholder="其他問題（可不填）"></textarea>

    <button class="back" onclick="sendOther()">
      送出其他問題
    </button>
  `;
}

function openSupplies(){

  if(gender === "F"){
    renderFemale();
  }else{
    renderMale();
  }
}

async function main(){

  await liff.init({
    liffId: LIFF_ID
  });

  const params =
    new URLSearchParams(window.location.search);

  // 改成抓 location
  loc = params.get("location");

  // 防呆
  if(!loc){
    loc = "未指定位置";
  }

  // 中文判斷男女廁
  if(loc.includes("女")){
    gender = "F";
  }else{
    gender = "M";
  }

  document.getElementById("location").innerHTML =
    "目前位置：<br>" + loc;

  openSupplies();
}

async function sendMsg(type){

  const text =
`【廁所通報】
位置：${loc}
問題：${type}`;

  try{

    await liff.sendMessages([{
      type:'text',
      text:text
    }]);

    document.body.innerHTML = `
      <div style="
        padding:50px;
        font-size:32px;
        color:#06C755;
      ">
        ✅ 已通報成功
      </div>
    `;

    setTimeout(()=>{
      liff.closeWindow();
    },1500);

  }catch(err){

    alert("送出失敗：" + err);

  }
}

async function sendOther(){

  const other =
    document.getElementById("other").value.trim();

  if(!other){
    alert("請輸入內容");
    return;
  }

  sendMsg(other);
}

main();

</script>

</body>
</html>
