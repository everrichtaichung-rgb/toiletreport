<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>廁所通報系統</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{
  font-family:sans-serif;
  padding:20px;
  text-align:center;
  background:#f5f5f5;
  margin:0;
}

.title{
  font-size:28px;
  margin:20px 0;
  font-weight:bold;
}

button{
  width:92%;
  padding:16px;
  margin:8px 0;
  font-size:20px;
  border:none;
  border-radius:12px;
  background:#06C755;
  color:white;
  font-weight:bold;
}

.back{
  background:#888;
}

textarea{
  width:92%;
  height:100px;
  margin-top:10px;
  padding:10px;
}

.success{
  padding:60px;
  font-size:30px;
  color:#06C755;
  font-weight:bold;
}

.loading{
  padding:60px;
  font-size:24px;
}
</style>
</head>

<body>

<div class="title" id="location">讀取中...</div>
<div id="main"></div>

<script>

/* ======================
   LIFF
====================== */
const LIFF_ID = "2009817649-AiEjedLg";

/* ======================
   Firebase
====================== */
const firebaseConfig = {
  apiKey: "AIzaSyCQ89mpw0Em3DQSOAvA_0uwdeCzBYlP5a8",
  authDomain: "toilet-report.firebaseapp.com",
  projectId: "toilet-report",
  storageBucket: "toilet-report.firebasestorage.app",
  messagingSenderId: "754527820587",
  appId: "1:754527820587:web:6b7ef45b481fa88edb836e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ======================
   變數
====================== */
let loc = "";
let gender = "M";
let sending = false;

/* ======================
   UI
====================== */
function render(){
  document.getElementById("main").innerHTML = `
    <button onclick="sendMsg('衛生紙不足')">衛生紙不足</button>
    <button onclick="sendMsg('酒精不足')">酒精不足</button>
    <button onclick="sendMsg('洗手乳不足')">洗手乳不足</button>
    <button onclick="sendMsg('需要清潔')">需要清潔</button>
    <button onclick="sendMsg('設備故障')">設備故障</button>

    <textarea id="other" placeholder="其他問題"></textarea>
    <button class="back" onclick="sendOther()">送出其他</button>
  `;
}

/* ======================
   初始化
====================== */
async function main(){

  await liff.init({ liffId: LIFF_ID });

  /* 🔥 已修正：穩定抓 loc */
  const query = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.replace("#","?"));

  loc =
    query.get("loc") ||
    hash.get("loc") ||
    "未指定位置";

  gender = loc.includes("女") ? "F" : "M";

  document.getElementById("location").innerHTML =
    "目前位置：<br>" + loc;

  render();
}

/* ======================
   送出
====================== */
async function sendMsg(type){

  if(sending) return;
  sending = true;

  document.body.innerHTML = `<div class="loading">送出中...</div>`;

  try{

    await db.collection("reports").add({
      location: loc,
      issue: type,
      gender: gender,
      time: new Date()
    });

    await liff.sendMessages([{
      type: "text",
      text: `【廁所通報】\n位置：${loc}\n問題：${type}`
    }]);

    document.body.innerHTML =
      `<div class="success">已通報成功</div>`;

    setTimeout(()=>liff.closeWindow(),1500);

  }catch(e){
    alert("失敗：" + e.message);
    location.reload();
  }

  sending = false;
}

function sendOther(){
  const t = document.getElementById("other").value.trim();
  if(!t) return alert("請輸入內容");
  sendMsg(t);
}

main();

</script>

</body>
</html>
